name: System CI & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-firmware:
    name: Compile ESP32 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.2.0

      - name: Run PlatformIO Compilation
        run: |
          cd firmware
          pio run

  validate-analytics:
    name: Test ML Anomaly Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analytics/requirements.txt

      - name: Execute Anomaly Detector Script
        run: |
          python analytics/anomaly_detector.py
          python -m unittest discover -s analytics -p 'test_*.py'
